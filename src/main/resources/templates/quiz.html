<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mental Wellness Quiz</title>
    <link rel="stylesheet" href="/css/HeaderFooter.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<header>
    <nav>
        <div class="nav_left">
            <img src="/images/logoImg.png" alt="elevateU logo">
            <strong class="brand-name">elevateU</strong>
        </div>

        <div class="nav_center">
            <!-- ✅ routes fixed -->
            <a href="/">Home</a>
            <a href="/about">About Us</a>
            <a href="#footer">Contact Us</a>
            <a href="/login">Login</a>
            <a href="/registration">Register</a>
        </div>

        <div class="nav_right">

        </div>
    </nav>
</header>

<div class="container mt-5 mb-5">
    <div class="card shadow p-4">
        <h3 class="mb-4 text-center">Mental Wellness Assessment</h3>

        <form id="quizForm"></form>

        <div class="text-center mt-3">
            <button type="button" class="btn btn-success" onclick="calculateScore()">
                Submit
            </button>
        </div>

        <!-- RESULT SECTION -->
        <div id="resultSection" class="mt-4 text-center" style="display:none;">
            <h5>Assessment Result</h5>
            <p id="scoreText" class="fw-bold"></p>

            <div class="mt-3 p-3 bg-white border rounded position-relative" style="overflow:hidden;">
                <div style="filter: blur(4px); pointer-events:none; user-select:none;">
                    <p><strong>Detailed Psychological Insights</strong></p>
                    <p>Stress triggers analysis...</p>
                    <p>Emotional regulation breakdown...</p>
                    <p>Burnout probability...</p>
                    <p>Personal improvement roadmap...</p>
                </div>
                <div class="position-absolute top-50 start-50 translate-middle text-center w-100">
                    <p class="text-danger fw-bold">🔒 Register to unlock full report</p>
                    <a href="/registration" class="btn btn-primary btn-sm">Register Now</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const questions = [
        "I feel stressed even when there is no clear reason.",
        "I find it easy to relax after a long day.",
        "I worry about things more than I should.",
        "I feel confident handling unexpected situations.",
        "I get irritated easily over small matters.",
        "I am able to control my emotions effectively.",
        "I often feel overwhelmed by responsibilities.",
        "I remain calm under pressure.",
        "I overthink decisions before making them.",
        "I feel mentally exhausted most of the time."
    ];

    // Render questions dynamically
    const form = document.getElementById("quizForm");

    questions.forEach((q, index) => {
        const div = document.createElement("div");
        div.classList.add("mb-4");
        div.innerHTML = `
            <p><strong>${index + 1}. ${q}</strong></p>
            ${[1, 2, 3, 4, 5].map(value => `
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="q${index + 1}" value="${value}" id="q${index + 1}_${value}">
                    <label class="form-check-label" for="q${index + 1}_${value}">
                        ${["Strongly Disagree", "Disagree", "Neutral", "Agree", "Strongly Agree"][value - 1]}
                    </label>
                </div>
            `).join("")}
        `;
        form.appendChild(div);
    });

    function calculateScore() {
        // Check all questions are answered
        for (let i = 1; i <= 10; i++) {
            if (!document.querySelector(`input[name="q${i}"]:checked`)) {
                alert("Please answer all questions before submitting.");
                return;
            }
        }

        let total = 0;

        // Negative questions: higher answer = more stress (normal scoring)
        const negativeQuestions = [1, 3, 5, 7, 9, 10];

        // Positive questions: higher answer = less stress (reverse scoring)
        const positiveQuestions = [2, 4, 6, 8];

        negativeQuestions.forEach(q => {
            const answer = document.querySelector(`input[name="q${q}"]:checked`);
            total += parseInt(answer.value);
        });

        positiveQuestions.forEach(q => {
            const answer = document.querySelector(`input[name="q${q}"]:checked`);
            total += (6 - parseInt(answer.value)); // reverse score
        });

        let personality = "";
        let description = "";

        if (total <= 15) {
            personality = "🌿 Calm & Emotionally Balanced";
            description = "You manage stress well and maintain strong emotional control.";
        } else if (total <= 25) {
            personality = "⚖ Moderately Balanced";
            description = "You experience stress occasionally but handle it fairly well.";
        } else if (total <= 35) {
            personality = "😟 High Stress Prone";
            description = "You may experience frequent stress and emotional strain.";
        } else {
            personality = "🔥 Emotionally Overloaded";
            description = "You may be under significant mental stress and could benefit from guidance or support.";
        }

        document.getElementById("scoreText").innerHTML = `
            <strong>Total Score:</strong> ${total} / 50 <br>
            <strong>Personality Type:</strong> ${personality} <br>
            <small class="text-muted">${description}</small>
        `;

        document.getElementById("resultSection").style.display = "block";
        document.getElementById("resultSection").scrollIntoView({ behavior: "smooth" });
    }
</script>

</body>
</html>
