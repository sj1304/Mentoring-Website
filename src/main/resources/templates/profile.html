<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile </title>
    <link rel="stylesheet" href="/css/HeaderFooter.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .navbar-custom { display: flex; justify-content: space-between; align-items: center; padding: 12px 5%; background: #fff; border-bottom: 1px solid #e0e0e0; }
        .profile-container { display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 20px; }
        .profile-card { background: white; border-radius: 15px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 500px; width: 100%; text-align: center; }
        .profile-icon { font-size: 5rem; color: #2e7d32; margin-bottom: 20px; }
        .details-list { text-align: left; margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px; }
        .detail-item { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #f9f9f9; padding-bottom: 8px; }
        .detail-label { font-weight: 700; color: #555; }
        .detail-value { color: #222; font-weight: 500; }
        .btn-dashboard { display: inline-block; margin-top: 25px; padding: 10px 30px; border: 1.5px solid #2e7d32; color: #2e7d32; text-decoration: none; border-radius: 8px; font-weight: 600; transition: 0.3s; }
        .btn-dashboard:hover { background-color: #2e7d32; color: #fff; }
        .debug-box { font-size: 0.8rem; color: red; margin-bottom: 10px; border: 1px dashed red; padding: 5px; }
    </style>
</head>
<body>

<header>
    <nav>
        <div class="nav_left">
            <img src="/images/logoImg.png" alt="elevateU logo">
            <strong class="brand-name">elevateU</strong>
        </div>

        <div class="nav_center">
            <!-- ✅ routes fixed -->
            <a href="/">Home</a>
            <a href="/about">About Us</a>
            <a href="#footer">Contact Us</a>

        </div>

        <div class="nav_right">
            <a href="/notifications" class="icon bell">
                <i class="fa-solid fa-bell"></i>
            </a>

            <a href="/profile" class="icon">
                <i class="fa-solid fa-user"></i>
            </a>

            <a href="/logout" class="logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </nav>
</header>


<div class="profile-container">
    <div class="profile-card">

        <i class="fa-solid fa-circle-user profile-icon"></i>
        <h3 class="fw-bold mb-1" th:text="${name ?: 'User Name'}">User Name</h3>
        <p class="text-muted" th:text="${email ?: 'email@college.edu'}">email@college.edu</p>

        <div class="details-list">
            <div th:if="${#strings.equalsIgnoreCase(session.role, 'mentor')}">
                <div class="detail-item">
                    <span class="detail-label">Department:</span>
                    <span class="detail-value" th:text="${dept ?: 'Not Set'}">Psychology</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Designation:</span>
                    <span class="detail-value" th:text="${desig ?: 'Not Set'}">Assistant Professor</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Experience:</span>
                    <span class="detail-value" th:text="${exp != null ? exp + ' Years' : 'Not Set'}">10 Years</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Teaching Level:</span>
                    <span class="detail-value" th:text="${level ?: 'Not Set'}">UG</span>
                </div>
            </div>

            <div th:if="${#strings.equalsIgnoreCase(session.role, 'mentee') or #strings.equalsIgnoreCase(session.role, 'student')}">
                <div class="detail-item">
                    <span class="detail-label">Roll Number:</span>
                    <span class="detail-value" th:text="${roll ?: '--'}">--</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Programme:</span>
                    <span class="detail-value" th:text="${prog ?: '--'}">--</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Level:</span>
                    <span class="detail-value" th:text="${level ?: '--'}">--</span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">Semester:</span>
                    <span class="detail-value" th:text="${sem ?: '--'}">--</span>
                </div>
            </div>
        </div>

        <a th:href="${#strings.equalsIgnoreCase(session.role, 'mentor') ? '/mentor_dashboard' : '/student_dashboard'}" class="btn-dashboard">
            Back to Dashboard
        </a>
    </div>
</div>

</body>
</html>
